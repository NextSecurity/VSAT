name: Pages

on:
  push:
    branches: [master]
    paths: ['site/**', 'assets/**', 'src/**', 'rules/**', 'data/**', 'vsat.ps1', 'CHANGELOG.md', 'build/Build-Site.ps1']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site with synthetic demo report
        shell: pwsh
        run: ./build/Build-Site.ps1 -OutDir ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
